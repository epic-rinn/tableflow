# Local development and test services only. Not a deployment definition.
# Email goes through Resend SMTP (ADR-0005); there is no local mail sink.
# Credentials are dummy values for disposable local data.
name: tableflow

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_only
    ports:
      - "127.0.0.1:${TABLEFLOW_DB_PORT:-54318}:5432"
    volumes:
      - ./src/api/db/local/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tableflow"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
