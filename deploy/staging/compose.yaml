# Staging rehearsal stack (MVP-21): PostgreSQL, one-shot migrations, API,
# admin and PWA behind Caddy with HTTPS on separate origins. Secrets come
# from deploy/staging/staging.env (git-ignored; see staging.env.example).
# Run from the repository root:
#   docker compose -f deploy/staging/compose.yaml --env-file deploy/staging/staging.env up -d --build
name: tableflow-staging

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      TABLEFLOW_OWNER_PASSWORD: ${TABLEFLOW_OWNER_PASSWORD:?set TABLEFLOW_OWNER_PASSWORD}
      TABLEFLOW_APP_PASSWORD: ${TABLEFLOW_APP_PASSWORD:?set TABLEFLOW_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "tableflow"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build: { context: ../.., dockerfile: deploy/api.Dockerfile }
    image: tableflow-api:staging
    entrypoint: ["/usr/local/bin/migrate", "up"]
    environment:
      MIGRATION_DATABASE_URL: postgres://tableflow_owner:${TABLEFLOW_OWNER_PASSWORD}@postgres:5432/tableflow?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    image: tableflow-api:staging
    environment:
      DATABASE_URL: postgres://tableflow_app:${TABLEFLOW_APP_PASSWORD}@postgres:5432/tableflow?sslmode=disable
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY}
      ADMIN_ORIGINS: https://${ADMIN_HOST}
      PWA_ORIGINS: https://${PWA_HOST}
      PWA_PUBLIC_URL: https://${PWA_HOST}
      # Only the private network where Caddy and the Next servers live; Caddy
      # replaces client-supplied X-Forwarded-For with the real client address.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.30.0.0/24}
      MAIL_ADAPTER: smtp
      SMTP_ADDR: ${SMTP_ADDR:-smtp.resend.com:587}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM}
      DB_POOL_STATS_INTERVAL: 1m
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/usr/local/bin/tableflow-api", "-healthcheck"]
      interval: 10s
      retries: 6
    restart: unless-stopped

  admin:
    build:
      context: ../..
      dockerfile: deploy/next.Dockerfile
      args: { APP: admin, NEXT_PUBLIC_PWA_URL: "https://${PWA_HOST}" }
    environment:
      API_INTERNAL_URL: http://api:8080
    depends_on: [api]
    restart: unless-stopped

  pwa:
    build:
      context: ../..
      dockerfile: deploy/next.Dockerfile
      args: { APP: pwa }
    environment:
      API_INTERNAL_URL: http://api:8080
    depends_on: [api]
    restart: unless-stopped

  caddy:
    image: caddy:2.10
    ports: ["443:443", "80:80"]
    environment:
      ADMIN_HOST: ${ADMIN_HOST:?set ADMIN_HOST}
      PWA_HOST: ${PWA_HOST:?set PWA_HOST}
      CADDY_TLS: ${CADDY_TLS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [admin, pwa]
    restart: unless-stopped

volumes:
  pgdata:
  caddydata:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
