openapi: 3.1.0
info:
  title: TableFlow API
  version: 0.1.0
  description: >-
    Machine-readable wire contract for implemented TableFlow routes only.
    Policies and planned routes are described in http.md. Routes are added
    here before their implementation lands.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8080
    description: Local Go API (also reachable through each frontend's same-origin /api/v1 proxy)
security: []
tags:
  - name: health
    description: Process liveness and dependency readiness
  - name: staff
    description: Staff sessions, activation and administration (admin origin only)
  - name: guest
    description: Anonymous bootstrap and QR capability sessions (PWA origin only)
  - name: seating
    description: Tables, seating groups, queue, holds, visits and table lifecycle
  - name: ordering
    description: Menu, orders, kitchen lines and assistance
  - name: billing
    description: Charge policies, bills, cashier settlement, receipts and full refunds (admin origin; guests may only read their bill)
  - name: loyalty
    description: Loyalty policy, member visit claims and member points history
  - name: member
    description: Member accounts and sessions (PWA origin only); responses never reveal whether an email is registered
paths:
  /api/v1/health/live:
    get:
      operationId: getLiveness
      tags: [health]
      summary: Process liveness
      description: Returns 200 while the process can serve HTTP. Never contacts PostgreSQL.
      responses:
        '200':
          description: Process is alive
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
  /api/v1/health/ready:
    get:
      operationId: getReadiness
      tags: [health]
      summary: Dependency readiness
      description: >-
        Pings PostgreSQL once within a bounded timeout (default 1 s).
        Concurrent probes share one in-flight check.
      responses:
        '200':
          description: Dependencies are reachable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: A dependency is unavailable or timed out
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/sessions/staff:
    post:
      operationId: createStaffSession
      tags: [staff]
      summary: Staff sign-in
      description: >-
        Requires an allowed admin Origin. Throttled per email (10) and client
        IP (30) per 10 minutes. Unknown, inactive and wrong-password accounts
        receive the same 401. Sets the host-only `__Host-tf_staff` cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: {type: string, maxLength: 254}
                password: {type: string, maxLength: 512}
      responses:
        '201':
          description: Session created
          headers:
            Set-Cookie:
              description: '`__Host-tf_staff=<token>; Path=/; Expires=...; HttpOnly; Secure; SameSite=Strict`'
              schema: {type: string}
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffIdentity'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/v1/sessions/current:
    get:
      operationId: getCurrentStaffSession
      tags: [staff]
      summary: Current staff identity and roles
      security: [{staffSession: []}]
      responses:
        '200':
          description: Authenticated staff member
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffIdentity'}
        '401': {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteCurrentStaffSession
      tags: [staff]
      summary: Sign out (revoke this session)
      security: [{staffSession: []}]
      responses:
        '204':
          description: Session revoked and cookie cleared
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/staff/activate:
    post:
      operationId: activateStaffAccount
      tags: [staff]
      summary: Set the password of an invited account with its single-use token
      description: >-
        Requires an allowed admin Origin; throttled per client IP (20 per 10
        minutes). Invalid, used, revoked and expired tokens all return 422
        TOKEN_INVALID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: {type: string}
                password: {type: string, minLength: 12, maxLength: 512}
                display_name: {type: string, maxLength: 100}
      responses:
        '200':
          description: Account activated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: {type: string, const: active}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/v1/branches/{branch_id}/staff:
    parameters:
      - {name: branch_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listStaff
      tags: [staff]
      summary: Page through a branch's staff accounts (manager)
      description: Other branches and malformed IDs return 404; non-managers get 403.
      security: [{staffSession: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 256}}
      responses:
        '200':
          description: One keyset page ordered by (created_at, id)
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffPage'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    post:
      operationId: inviteStaff
      tags: [staff]
      summary: Create an invited staff account (manager)
      description: The activation token is returned once; share `/activate#<token>` privately.
      security: [{staffSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, display_name, roles]
              properties:
                email: {type: string, maxLength: 254}
                display_name: {type: string, minLength: 1, maxLength: 100}
                roles: {$ref: '#/components/schemas/Roles'}
      responses:
        '201':
          description: Invited account and one-time activation token
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [staff, activation]
                properties:
                  staff: {$ref: '#/components/schemas/Staff'}
                  activation: {$ref: '#/components/schemas/Activation'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/staff/{staff_id}/activation:
    parameters:
      - {name: staff_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: reissueStaffActivation
      tags: [staff]
      summary: Replace an invited account's activation token (manager)
      security: [{staffSession: []}]
      responses:
        '201':
          description: New one-time token; the previous one is revoked
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Activation'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/staff/{staff_id}/roles:
    parameters:
      - {name: staff_id, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: setStaffRoles
      tags: [staff]
      summary: Replace roles (manager); revokes the target's sessions
      security: [{staffSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version, roles]
              properties:
                expected_version: {type: integer, minimum: 1}
                roles: {$ref: '#/components/schemas/Roles'}
      responses:
        '200':
          description: Updated account
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Staff'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/staff/{staff_id}/deactivate:
    parameters:
      - {name: staff_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: deactivateStaff
      tags: [staff]
      summary: Disable an account (manager); revokes sessions and open tokens
      security: [{staffSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version, reason]
              properties:
                expected_version: {type: integer, minimum: 1}
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '200':
          description: Disabled account
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Staff'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/sessions/anonymous:
    post:
      operationId: startAnonymousSession
      tags: [guest]
      summary: Create or reuse an anonymous bootstrap session
      description: >-
        Requires an allowed PWA Origin; throttled per client IP (60 per 10
        minutes). Returns 200 without Set-Cookie when a valid anonymous
        cookie is already present.
      responses:
        '200':
          description: Existing session reused
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnonymousSession'}
        '201':
          description: New session; sets `__Host-tf_anon` (HttpOnly, Secure, SameSite=Lax, Path=/)
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnonymousSession'}
        '403': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/v1/sessions/capability:
    post:
      operationId: exchangeCapability
      tags: [guest]
      summary: Exchange a queue or dining QR token for a guest session
      description: >-
        The token comes from the URL fragment and is sent only in this body.
        It is not consumed; every diner can exchange the active token. Any
        unusable token (unknown, rotated, revoked, expired, wrong kind)
        returns 422 TOKEN_INVALID. Throttled per client IP (120 per 10 minutes).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, kind]
              properties:
                token: {type: string, maxLength: 64}
                kind: {type: string, enum: [queue, visit]}
      responses:
        '201':
          description: Guest session created; sets `__Host-tf_guest` (HttpOnly, Secure, SameSite=Lax, Path=/)
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GuestSession'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/v1/sessions/guest:
    get:
      operationId: getGuestSession
      tags: [guest]
      summary: Current guest session scope
      security: [{guestSession: []}]
      responses:
        '200':
          description: Active guest session
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GuestSession'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/members:
    post:
      operationId: signUpMember
      tags: [member]
      summary: Register; emails a verification link (or an existing-account notice)
      description: Throttled per client IP (20 per 10 minutes).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, locale]
              properties:
                email: {type: string, maxLength: 254}
                password: {type: string, minLength: 12, maxLength: 512}
                locale: {type: string, enum: [th, en]}
      responses:
        '202':
          description: Neutral acknowledgement (same for registered and unknown emails)
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckEmail'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/v1/members/verification:
    post:
      operationId: resendMemberVerification
      tags: [member]
      summary: Email a new verification link to an unverified account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: {type: string, maxLength: 254}
      responses:
        '202':
          description: Neutral acknowledgement (same for registered and unknown emails)
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckEmail'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/v1/members/verify:
    post:
      operationId: verifyMemberEmail
      tags: [member]
      summary: Confirm an email address with a single-use token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: {type: string, maxLength: 64}
      responses:
        '200':
          description: Email verified
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: {type: string, const: verified}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/v1/members/me:
    get:
      operationId: getCurrentMember
      tags: [member]
      summary: The signed-in member's own account
      security: [{memberSession: []}]
      responses:
        '200':
          description: Own account
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/members/password-reset/request:
    post:
      operationId: requestMemberPasswordReset
      tags: [member]
      summary: Email a password-reset link when the account exists
      description: Throttled per email (5) and client IP (30) per 10 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: {type: string, maxLength: 254}
      responses:
        '202':
          description: Neutral acknowledgement (same for registered and unknown emails)
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckEmail'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/v1/members/password-reset/confirm:
    post:
      operationId: confirmMemberPasswordReset
      tags: [member]
      summary: Set a new password; verifies the email and revokes every session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, new_password]
              properties:
                token: {type: string, maxLength: 64}
                new_password: {type: string, minLength: 12, maxLength: 512}
      responses:
        '200':
          description: Password reset; the member cookie is cleared
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: {type: string, const: password_reset}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/v1/sessions/member:
    post:
      operationId: createMemberSession
      tags: [member]
      summary: Member sign-in
      description: >-
        Throttled per email (10) and client IP (100) per 10 minutes. Sets
        `__Host-tf_member` (HttpOnly, Secure, SameSite=Lax, Path=/; 30 days
        absolute, 7 days idle). Unverified members may sign in; features that
        need a trusted email check `email_verified`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: {type: string, maxLength: 254}
                password: {type: string, maxLength: 512}
      responses:
        '201':
          description: Session created
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
    delete:
      operationId: deleteMemberSession
      tags: [member]
      summary: Member sign-out
      security: [{memberSession: []}]
      responses:
        '204':
          description: Session revoked and cookie cleared
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/branches/{branch_id}/seating-groups:
    parameters:
      - {name: branch_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getSeatingGroups
      tags: [seating]
      summary: Current seating groups (any staff role)
      security: [{staffSession: []}]
      responses:
        '200':
          description: Current bands
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupList'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    put:
      operationId: replaceSeatingGroups
      tags: [seating]
      summary: Replace seating groups (manager; only while no ticket is active)
      security: [{staffSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [groups]
              properties:
                groups: {type: array, minItems: 1, maxItems: 10, items: {$ref: '#/components/schemas/GroupInput'}}
      responses:
        '200':
          description: New bands
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupList'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/branches/{branch_id}/tables:
    parameters:
      - {name: branch_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listTables
      tags: [seating]
      summary: 'Floor board: all tables with claims (≤100)'
      security: [{staffSession: []}]
      responses:
        '200':
          description: Tables
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TableList'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      operationId: createTable
      tags: [seating]
      summary: Add a table (manager)
      security: [{staffSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [label, capacity, needs]
              properties:
                label: {type: string, minLength: 1, maxLength: 20}
                capacity: {type: integer, minimum: 1, maximum: 50}
                needs: {$ref: '#/components/schemas/Needs'}
      responses:
        '201':
          description: Table created
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Table'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/tables/{table_id}:
    parameters:
      - {name: table_id, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: updateTable
      tags: [seating]
      summary: Edit a table (manager); claimed tables cannot be deactivated or shrunk
      security: [{staffSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
