openapi: 3.1.0
info:
  title: TableFlow API
  version: 0.1.0
  description: >-
    Machine-readable wire contract for implemented TableFlow routes only.
    Policies and planned routes are described in http.md. Routes are added
    here before their implementation lands.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8080
    description: Local Go API (also reachable through each frontend's same-origin /api/v1 proxy)
security: []
tags:
  - name: health
    description: Process liveness and dependency readiness
paths:
  /api/v1/health/live:
    get:
      operationId: getLiveness
      tags: [health]
      summary: Process liveness
      description: Returns 200 while the process can serve HTTP. Never contacts PostgreSQL.
      responses:
        '200':
          description: Process is alive
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
  /api/v1/health/ready:
    get:
      operationId: getReadiness
      tags: [health]
      summary: Dependency readiness
      description: >-
        Pings PostgreSQL once within a bounded timeout (default 1 s).
        Concurrent probes share one in-flight check.
      responses:
        '200':
          description: Dependencies are reachable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: A dependency is unavailable or timed out
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  headers:
    RequestId:
      description: Correlation ID; an incoming value is reused only if it matches the pattern.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,64}$'
    NoStore:
      description: Responses are never stored by browsers or shared caches.
      schema:
        type: string
        const: no-store
  schemas:
    Liveness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          const: ready
        checks:
          type: object
          additionalProperties: false
          required: [database]
          properties:
            database:
              type: string
              const: ok
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id, fields]
          properties:
            code:
              type: string
              pattern: '^[A-Z][A-Z0-9_]*$'
              examples: [DEPENDENCY_UNAVAILABLE]
            message:
              type: string
            request_id:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
