      tags: [loyalty]
      summary: 'Own points, tier and progress per branch (member)'
      security: [{memberSession: []}]
      responses:
        '200':
          description: Profiles
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemberLoyaltyList'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/members/me/loyalty/entries:
    get:
      operationId: listMyLoyaltyEntries
      tags: [loyalty]
      summary: 'Own points history, newest first (member)'
      security: [{memberSession: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 512}}
      responses:
        '200':
          description: History page
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LedgerPage'}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID; the same key and body replays the committed result, a different body returns 409 IDEMPOTENCY_CONFLICT.
      schema: {type: string, format: uuid}
  securitySchemes:
    anonymousSession:
      type: apiKey
      in: cookie
      name: __Host-tf_anon
      description: Anonymous bootstrap session on the PWA origin (queue join only).
    memberSession:
      type: apiKey
      in: cookie
      name: __Host-tf_member
      description: Member session on the PWA origin; coexists with guest cookies.
    guestSession:
      type: apiKey
      in: cookie
      name: __Host-tf_guest
      description: Capability-derived guest session on the PWA origin; valid only for the capability's current generation.
    staffSession:
      type: apiKey
      in: cookie
      name: __Host-tf_staff
      description: Host-only staff session cookie. Mutations also require an allowed admin Origin.
  responses:
    BillingError:
      description: Error, optionally with the fresh bill, unresolved lines or the existing settlement
      content:
        application/json:
          schema: {$ref: '#/components/schemas/BillingError'}
    Error:
      description: Error in the common envelope
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimited:
      description: Too many attempts
      headers:
        Retry-After:
          description: Seconds until the window resets
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  headers:
    RequestId:
      description: Correlation ID; an incoming value is reused only if it matches the pattern.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,64}$'
    NoStore:
      description: Responses are never stored by browsers or shared caches.
      schema:
        type: string
        const: no-store
    PrivateNoStore:
      description: Authenticated responses are private and never stored.
      schema:
        type: string
        const: private, no-store
  schemas:
    Liveness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          const: ready
        checks:
          type: object
          additionalProperties: false
          required: [database]
          properties:
            database:
              type: string
              const: ok
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id, fields]
          properties:
            code:
              type: string
              pattern: '^[A-Z][A-Z0-9_]*$'
              examples: [DEPENDENCY_UNAVAILABLE]
            message:
              type: string
            request_id:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
    Roles:
      type: array
      minItems: 1
      maxItems: 4
      uniqueItems: true
      items:
        type: string
        enum: [cashier, host, kitchen, manager]
    StaffIdentity:
      type: object
      additionalProperties: false
      required: [staff_id, branch_id, email, display_name, roles]
      properties:
        staff_id: {type: string, format: uuid}
        branch_id: {type: string, format: uuid}
        email: {type: string}
        display_name: {type: string}
        roles: {$ref: '#/components/schemas/Roles'}
        session_expires_at: {type: string, format: date-time}
    Staff:
      type: object
      additionalProperties: false
      required: [id, branch_id, email, display_name, status, roles, version, created_at]
      properties:
        id: {type: string, format: uuid}
        branch_id: {type: string, format: uuid}
        email: {type: string}
        display_name: {type: string}
        status: {type: string, enum: [invited, active, disabled]}
        roles: {$ref: '#/components/schemas/Roles'}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
    StaffPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, server_time]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Staff'}
        next_cursor: {type: [string, 'null']}
        server_time: {type: string, format: date-time}
    Activation:
      type: object
      additionalProperties: false
      required: [token, expires_at]
      properties:
        token: {type: string, description: 'Single-use secret; shown once'}
        expires_at: {type: string, format: date-time}
    GuestSession:
      type: object
      additionalProperties: false
      required: [branch_id, kind, resource_id, expires_at]
      properties:
        branch_id: {type: string, format: uuid}
        kind: {type: string, enum: [queue, visit]}
        resource_id: {type: string, format: uuid}
        expires_at: {type: string, format: date-time}
    AnonymousSession:
      type: object
      additionalProperties: false
      required: [expires_at]
      properties:
        expires_at: {type: string, format: date-time}
    CheckEmail:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, const: check_email}
    Member:
      type: object
      additionalProperties: false
      required: [member_id, email, locale, email_verified]
      properties:
        member_id: {type: string, format: uuid}
        email: {type: string}
        locale: {type: string, enum: [th, en]}
        email_verified: {type: boolean}
        session_expires_at: {type: string, format: date-time}
    Needs:
      type: array
      maxItems: 2
      uniqueItems: true
      items: {type: string, enum: [accessible, high_chair]}
    GroupInput:
      type: object
      additionalProperties: false
      required: [label, min_party, max_party]
      properties:
        label: {type: string, minLength: 1, maxLength: 40}
        min_party: {type: integer, minimum: 1}
        max_party: {type: integer, minimum: 1, maximum: 50}
    Group:
      type: object
      additionalProperties: false
      required: [id, label, min_party, max_party]
      properties:
        id: {type: string, format: uuid}
        label: {type: string}
        min_party: {type: integer}
        max_party: {type: integer}
    GroupList:
      type: object
      additionalProperties: false
      required: [groups]
      properties:
        groups: {type: array, items: {$ref: '#/components/schemas/Group'}}
    Table:
      type: object
      additionalProperties: false
      required: [id, label, capacity, needs, state, active, version, claim]
      properties:
        id: {type: string, format: uuid}
        label: {type: string}
        capacity: {type: integer}
        needs: {$ref: '#/components/schemas/Needs'}
        state: {type: string, enum: [available, held, occupied, cleaning]}
        active: {type: boolean}
        version: {type: integer}
        claim:
          oneOf:
            - {type: 'null'}
            - type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind: {type: string, enum: [hold, visit]}
                queue_ticket_id: {type: string, format: uuid}
                display_number: {type: integer}
                visit_id: {type: string, format: uuid}
    TableList:
      type: object
      additionalProperties: false
      required: [items, server_time]
      properties:
        items: {type: array, maxItems: 101, items: {$ref: '#/components/schemas/Table'}}
        server_time: {type: string, format: date-time}
    Ticket:
      type: object
      additionalProperties: false
      required: [id, branch_id, display_number, business_date, state, party_size, needs, source, seating_group, parties_ahead, called_until, called_table_label, overdue, version, created_at, server_time]
      properties:
        id: {type: string, format: uuid}
        branch_id: {type: string, format: uuid}
        display_number: {type: integer, minimum: 1}
        business_date: {type: string, format: date}
        state: {type: string, enum: [waiting, called, seated, cancelled, no_show]}
        party_size: {type: integer}
        needs: {$ref: '#/components/schemas/Needs'}
        source: {type: string, enum: [guest, staff]}
        seating_group:
          oneOf:
            - {type: 'null'}
            - type: object
              additionalProperties: false
              required: [id, label, min_party, max_party]
              properties:
                id: {type: string, format: uuid}
                label: {type: string}
                min_party: {type: integer}
                max_party: {type: integer}
        parties_ahead: {type: [integer, 'null'], minimum: 0, description: 'Waiting parties ahead in the same seating group (not a global seating order); null unless waiting'}
        called_until: {type: [string, 'null'], format: date-time}
        called_table_label: {type: [string, 'null']}
        overdue: {type: boolean}
        version: {type: integer}
        created_at: {type: string, format: date-time}
        server_time: {type: string, format: date-time}
    TicketPage:
      type: object
