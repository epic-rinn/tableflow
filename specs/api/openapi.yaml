        gross_satang: {type: integer, minimum: 0}
        discount_bp: {type: integer, minimum: 0, maximum: 10000}
        discount_satang: {type: integer, minimum: 0}
        net_satang: {type: integer, minimum: 0}
        service_satang: {type: integer, minimum: 0}
        tax_satang: {type: integer, minimum: 0}
        total_satang: {type: integer, minimum: 0}
    Settlement:
      type: object
      additionalProperties: false
      required: [id, visit_id, receipt_reference, amount_satang, method, paid_at, points_earned, bill]
      properties:
        id: {type: string, format: uuid}
        visit_id: {type: string, format: uuid}
        receipt_reference: {type: string, pattern: '^R-[A-Z2-7]{10}$'}
        amount_satang: {type: integer, minimum: 0}
        method: {type: string, enum: [cash, bank_transfer, card, other]}
        paid_at: {type: string, format: date-time}
        points_earned: {type: [integer, 'null'], minimum: 0}
        bill: {$ref: '#/components/schemas/Bill'}
    Refund:
      type: object
      additionalProperties: false
      required: [id, amount_satang, reason, external_reference, recorded_by, created_at]
